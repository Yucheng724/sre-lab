alertmanager:
  config:
    route:
      receiver: telegram
      group_by: [alertname]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      routes:
        - receiver: "null"
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: "null"
      - name: telegram
        telegram_configs:
          - bot_token: "<YOUR_BOT_TOKEN>"
            chat_id: 123456789
            send_resolved: true
